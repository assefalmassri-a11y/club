<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Club door</title>
<style>html,body{margin:0;height:100%;background:#0b0f14;color:#e8edf4;font-family:system-ui,Tahoma,sans-serif}
main{height:100%;display:grid;place-items:center;text-align:center}#qr{background:#fff;padding:18px;border-radius:18px;display:inline-block}
#qr svg,#qr img{display:block;width:min(70vmin,520px);height:auto}p{font-size:1.4rem;margin:1rem 0 0}#err{color:#f87171}</style></head>
<body><main><div><div id="qr"></div><p>امسح الكود من تطبيق Club</p><p id="err"></p></div></main>
<script src="vendor/qrcode.js"></script>
<script>
let last = '';
async function tick(){
  try{
    const r = await fetch('code',{cache:'no-store'}); const j = await r.json();
    document.getElementById('err').textContent='';
    if(j.payload!==last){
      last=j.payload;
      const q=qrcode(0,'M'); q.addData(j.payload); q.make();
      document.getElementById('qr').innerHTML=q.createSvgTag({cellSize:8,margin:0}); // generated by the local library from our own payload
    }
    setTimeout(tick, Math.max(500,(j.ttl*1000)-200 > 2000 ? 2000 : 800));
  }catch(e){ document.getElementById('err').textContent='...'; setTimeout(tick,2000); }
}
tick();
</script></body></html>
